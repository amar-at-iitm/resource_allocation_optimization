[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-allocation-optimization"
version = "0.1.0"
description = "Multi-Period Resource Allocation and Scheduling under Uncertainty"
readme = "README.md"
authors = [
    { name = "Amar Kumar" }
]
requires-python = ">=3.10"
dependencies = [
    "highspy>=1.15.0",
    "scipy>=1.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "PyYAML>=6.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "rich>=13.9.0",
    "streamlit>=1.40.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --import-mode=importlib"

